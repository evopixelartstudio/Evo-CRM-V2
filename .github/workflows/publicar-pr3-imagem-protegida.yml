name: Publicar imagem imutável do PR #3

on:
  workflow_dispatch:
    inputs:
      confirm_commit:
        description: "Digite o SHA completo 88ae27ec357d7077a6fcfd65315d973fd8c464ca"
        required: true
        type: string
      publish:
        description: "Publicar no GHCR após o smoke test"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publicar-pr3-imagem-protegida
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/evopixelartstudio/deskcommcrm
  SOURCE_BRANCH: fix/crm-close-conversation
  SOURCE_COMMIT: 88ae27ec357d7077a6fcfd65315d973fd8c464ca
  IMAGE_TAG: pr-3-88ae27e

jobs:
  build-smoke-and-optionally-publish:
    # O workflow só pode ser iniciado a partir da main depois de revisado e
    # incorporado. O código compilado vem separadamente da branch do PR e é
    # conferido pelo SHA antes do build.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validar solicitação protegida
        env:
          CONFIRM_COMMIT: ${{ inputs.confirm_commit }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          test "$CONFIRM_COMMIT" = "$SOURCE_COMMIT"
          test "$SOURCE_BRANCH" = "fix/crm-close-conversation"
          test "$SOURCE_COMMIT" = "88ae27ec357d7077a6fcfd65315d973fd8c464ca"
          test "$IMAGE" = "ghcr.io/evopixelartstudio/deskcommcrm"
          test "$IMAGE_TAG" = "pr-3-88ae27e"
          printf 'publicação solicitada: %s\n' "$PUBLISH"

      - name: Baixar exatamente o commit aprovado
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Confirmar branch e commit do código
        run: |
          set -euo pipefail
          atual=$(git rev-parse HEAD)
          remoto=$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | awk '{print $1}')
          test "$atual" = "$SOURCE_COMMIT"
          test "$remoto" = "$SOURCE_COMMIT"
          printf 'fonte confirmada: %s @ %s\n' "$SOURCE_BRANCH" "$atual"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagem local sem publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/evopixelartstudio/deskcommcrm:pr-3-88ae27e
          build-args: |
            APP_VERSION=pr-3-88ae27e
          cache-from: type=gha,scope=pr3-deskcommcrm-amd64
          cache-to: type=gha,mode=max,scope=pr3-deskcommcrm-amd64

      - name: Smoke test do container
        run: |
          set -euo pipefail
          docker run -d --name pr3-smoke -p 3000:3000 \
            -e NEXT_PUBLIC_SUPABASE_URL=https://exemplo.supabase.co \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY=chave-de-mentira \
            -e SUPABASE_SERVICE_ROLE_KEY=chave-de-mentira \
            -e SUPABASE_DB_URL=postgres://127.0.0.1:5432/postgres \
            -e SENTRY_DSN=off \
            ghcr.io/evopixelartstudio/deskcommcrm:pr-3-88ae27e
          trap 'docker rm -f pr3-smoke >/dev/null 2>&1 || true' EXIT
          pronto=nao
          for _ in $(seq 1 40); do
            if ! docker ps --filter name=pr3-smoke --filter status=running -q | grep -q .; then
              docker logs pr3-smoke 2>&1 || true
              exit 1
            fi
            if docker logs pr3-smoke 2>&1 | grep -qE "Ready in|started server on"; then
              pronto=sim
              break
            fi
            sleep 3
          done
          test "$pronto" = sim

      - name: Autenticar no GHCR somente com publicação explícita
        if: inputs.publish == true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar somente a tag imutável autorizada
        if: inputs.publish == true
        run: |
          set -euo pipefail
          test "$IMAGE" = "ghcr.io/evopixelartstudio/deskcommcrm"
          test "$IMAGE_TAG" = "pr-3-88ae27e"
          docker push "$IMAGE:$IMAGE_TAG"
          digest=$(docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          test -n "$digest"
          printf 'imagem publicada: %s@%s\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Registrar modo sem publicação
        if: inputs.publish != true
        run: printf 'smoke test concluído; publicação não solicitada\n' >> "$GITHUB_STEP_SUMMARY"
